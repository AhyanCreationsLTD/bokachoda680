name: Update Telegram Videos

on:
  schedule:
    # প্রতি ৬ ঘণ্টা পর পর রান করার জন্য ক্রন এক্সপ্রেশন
    - cron: '0 */6 * * *'
  workflow_dispatch: # হাত দিয়ে ম্যানুয়ালি রান করার অপশন

jobs:
  update-videos:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install pyrogram tgcrypto

      - name: Run Python Script
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python fetch_videos.py

      - name: Commit and Push if videos.json changed
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add videos.json
          git diff --quiet && git diff --cached --quiet || (git commit -m "Auto-update videos.json" && git push)
          
